name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The upstream commit is NOT pinned here — it is read from the attribution
  # header of okf/references/SPEC.md, the single source of truth, by the
  # "Resolve pinned upstream commit" step below. To bump upstream, edit that
  # header only; tests/test_pinned_refs.py fails if any other file lags behind.
  #
  # The clock, on the other hand, is pinned here and nowhere else. Upstream's
  # stale_after dates passing is their lifecycle event, not a defect in this
  # repo, so the gate evaluates staleness as of a fixed day. The freshness step
  # reports the real picture without failing.
  REFERENCE_AS_OF: "2026-07-30"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          # The validator resolves links case-exactly rather than deferring to the
          # filesystem; run once on macOS so a case-insensitive volume cannot
          # silently diverge from Linux.
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Tests (offline)
        working-directory: tests
        env:
          OKF_AS_OF: ${{ env.REFERENCE_AS_OF }}
        run: python -m unittest discover -s . -t . -v

      - name: Resolve pinned upstream commit
        run: |
          # SPEC.md's attribution header is the only place the commit is written.
          ref=$(sed -n 's|.*blob/\([0-9a-f]\{7,40\}\)/.*|\1|p' okf/references/SPEC.md | head -1)
          if [ -z "$ref" ]; then
            echo "::error::could not read a pinned commit from okf/references/SPEC.md"
            exit 1
          fi
          echo "Pinned upstream commit: $ref"
          echo "KNOWLEDGE_CATALOG_REF=$ref" >> "$GITHUB_ENV"

      - name: Fetch upstream reference bundles
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/GoogleCloudPlatform/knowledge-catalog.git upstream
          git -C upstream checkout --quiet "$KNOWLEDGE_CATALOG_REF"
          echo "OKF_REFERENCE_BUNDLES=$PWD/upstream/okf/bundles" >> "$GITHUB_ENV"

      - name: Tests (including reference bundles)
        working-directory: tests
        env:
          OKF_AS_OF: ${{ env.REFERENCE_AS_OF }}
        run: python -m unittest discover -s . -t . -v

      - name: Benchmark (this repo's validator must stay at 19/19 and 10/10)
        run: |
          out=$(python benchmark/run.py)
          echo "$out"
          echo "$out" | grep -q 'okf-skill .*detection 19/19   clean pass 10/10' || {
            echo "::error::benchmark regression — see the table above"
            exit 1
          }

      - name: Vendored spec matches upstream at the pinned commit
        run: |
          # Everything after the attribution header must be byte-identical.
          tail -n +6 okf/references/SPEC.md > /tmp/vendored.md
          if ! diff -u upstream/okf/SPEC.md /tmp/vendored.md; then
            echo "::error::okf/references/SPEC.md has drifted from upstream at $KNOWLEDGE_CATALOG_REF"
            exit 1
          fi

      - name: Validator runs clean on every reference bundle
        run: |
          rc=0
          for bundle in upstream/okf/bundles/*/; do
            name=$(basename "$bundle")
            echo "--- $name"
            python okf/scripts/validate_okf.py "$bundle" --strict --today "$REFERENCE_AS_OF" || rc=1
            python okf/scripts/generate_index.py "$bundle" --check || rc=1
          done
          exit $rc

      # Upstream staleness is deliberately not checked here. It is a function of
      # the calendar rather than of this repo's commits, and a run annotation
      # notifies nobody, so it lives in upstream-freshness.yml, which runs on a
      # schedule and reports by opening an issue.
